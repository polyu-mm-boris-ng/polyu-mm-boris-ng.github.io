<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Has Moved / Redirecting...</title>
    
    <!-- Fallback: If JavaScript is disabled, this will still redirect after 5 seconds -->
    <meta http-equiv="refresh" content="5;url=https://boris-ng.vercel.app">
    
    <style>
        /* Simple styling for a clean, modern look */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 85%;
        }
        h1 {
            font-size: 22px;
            margin-top: 0;
            color: #111827;
        }
        p {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 20px;
        }
        .countdown-box {
            margin: 20px 0 5px 0;
        }
        .countdown-number {
            font-size: 48px;
            font-weight: bold;
            color: #2563eb; /* Blue theme */
            line-height: 1;
        }
        .seconds-text {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 24px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Website Has Moved 🚀</h1>
        <p>Redirecting you to the new address...</p>
        
        <div class="countdown-box">
            <div class="countdown-number" id="timer">5</div>
        </div>
        
        <div class="seconds-text">seconds</div>
        
        <!-- Manual button in case the user doesn't want to wait -->
        <a href="https://boris-ng.vercel.app" class="btn">Go to New Site Now</a>
    </div>

    <script>
        // Countdown logic
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        const targetUrl = "https://boris-ng.vercel.app";

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown); // Stop the timer
                window.location.replace(targetUrl); // Execute redirect
            }
        }, 1000); // 1000ms = 1 second
    </script>

</body>
</html>
